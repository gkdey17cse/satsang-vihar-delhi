<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dk3sj0t4u/image/upload/w_200,q_auto,f_auto/v1769624131/logo_light_smzzit.png" />
  <title>Satsang Vihar Delhi</title>

  <script type="text/javascript">
    var l = window.location;
    // This script converts the current path into a query string and redirects to index.html
    // Example: /conference-du-2026 -> /? /conference-du-2026
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
